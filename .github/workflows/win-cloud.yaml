name: High-Speed Windows Cloud Desktop (RustDesk)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Set up RDP User Credentials
      run: |
        $Password = ConvertTo-SecureString "NewUser_2700" -AsPlainText -Force
        New-LocalUser "CloudUser" -Password $Password -Description "RDP User Account"
        Add-LocalGroupMember -Group "Administrators" -Member "CloudUser"

    - name: Install and Configure RustDesk
      run: |
        # Download RustDesk Portable
        Invoke-WebRequest -Uri "https://github.com/rustdesk/rustdesk/releases/download/1.2.3/rustdesk-1.2.3-x86_64.exe" -OutFile "rustdesk.exe"
        
        # Set permanent password
        Start-Process -FilePath ".\rustdesk.exe" -ArgumentList "--password NewUser_2700" -NoNewWindow
        
        # Start RustDesk background service
        Start-Process -FilePath ".\rustdesk.exe" -ArgumentList "--service" -NoNewWindow
        
        Start-Sleep -Seconds 5
        
        # Get RustDesk ID
        $rustdeskId = (.\rustdesk.exe --get-id)
        
        Write-Host "========================================="
        Write-Host "RUSTDESK ID: $rustdeskId"
        Write-Host "PASSWORD: NewUser_2700"
        Write-Host "========================================="

    - name: Keep Runner Alive
      run: |
        while ($true) { Start-Sleep -Seconds 60 }
