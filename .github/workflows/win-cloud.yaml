name: Windows Cloud RDP over Ngrok

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable Windows Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Optimize Visual Settings for Speed
      run: |
        Set-ItemProperty -Path 'HKLM:\Software\Policies\Microsoft\Windows\Control Panel\Desktop' -Name "UserPreferencesMask" -Value ([byte[]](0x90,0x12,0x03,0x80,0x10,0x00,0x00,0x00)) -ErrorAction SilentlyContinue
        Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "ColorDepth" -Value 2

    - name: Set up RDP User Credentials
      run: |
        $Password = ConvertTo-SecureString "NewUser_2700" -AsPlainText -Force
        New-LocalUser "CloudUser" -Password $Password -Description "RDP User Account"
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "CloudUser"
        Add-LocalGroupMember -Group "Administrators" -Member "CloudUser"

    - name: Start Ngrok Tunnel
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
      run: |
        choco install ngrok -y
        ngrok config add-authtoken $env:NGROK_AUTH_TOKEN
        
        # Start Ngrok in the background
        Start-Process ngrok -ArgumentList "tcp 3389"
        
        # Retry loop to give Ngrok time to initialize its API
        $publicUrl = ""
        for ($i = 0; $i -lt 10; $i++) {
            Start-Sleep -Seconds 3
            try {
                $response = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -ErrorAction Stop
                $publicUrl = $response.tunnels[0].public_url -replace "tcp://", ""
                if ($publicUrl) { break }
            } catch {
                Write-Host "Waiting for Ngrok API..."
            }
        }

        if (-not $publicUrl) {
            Write-Error "Failed to obtain Ngrok tunnel URL."
            exit 1
        }

        Write-Host "========================================="
        Write-Host "RDP CONNECT ADDRESS: $publicUrl"
        Write-Host "Username: CloudUser"
        Write-Host "Password: NewUser_2700"
        Write-Host "========================================="

    - name: Keep Runner Alive
      run: |
        while ($true) { Start-Sleep -Seconds 60 }
