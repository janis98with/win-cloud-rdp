name: Windows Cloud RDP over Tailscale

on: 
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360 

    steps:
    - name: Download and Extract Standalone Tailscale Zip
      run: |
        # Download the official stable standalone portable zip archive
        Invoke-WebRequest -Uri "https://tailscale.com" -OutFile "tailscale.tgz"
        
        # Extract the tgz package directly using tar (native in Windows Server runners)
        tar -xvzf tailscale.tgz
        
        # Locate the extracted folder dynamically and rename it to a clean path
        $extractedDir = Get-ChildItem -Directory | Where-Name -Like "tailscale_*" | Select-Object -First 1
        Rename-Item -Path $extractedDir.FullName -NewName "TailscalePortable"

    - name: Connect to Tailscale
      env:
        TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      run: |
        # Run Tailscale directly from the portable directory
        & ".\TailscalePortable\tailscale.exe" up --authkey=$env:TAILSCALE_AUTH_KEY --accept-routes
        
    - name: Enable Windows Remote Desktop (RDP)
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        
    - name: Set up RDP User Credentials
      run: |
        $Password = ConvertTo-SecureString "NewUser_2700" -AsPlainText -Force
        New-LocalUser "CloudUser" -Password $Password -Description "RDP User Account"
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "CloudUser"
        Add-LocalGroupMember -Group "Administrators" -Member "CloudUser"
        
    - name: Output Tailscale Connection Info
      run: |
        Write-Host "========================================="
        Write-Host "Tailscale Setup Complete!"
        Write-Host "Find the IP address of this machine in your Tailscale Admin Console."
        Write-Host "Username: CloudUser"
        Write-Host "Password: NewUser_2700"
        Write-Host "========================================="

    - name: Keep Runner Alive
      run: |
        while ($true) { Start-Sleep -Seconds 60 }
