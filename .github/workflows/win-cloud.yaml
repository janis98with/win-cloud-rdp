name: Windows Cloud RDP over Tailscale

on: 
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360 

    steps:
    - name: Clean and Install Tailscale MSI Package
      run: |
        Invoke-WebRequest -Uri "https://tailscale.com" -OutFile "tailscale.msi"
        Start-Process msiexec.exe -ArgumentList '/i tailscale.msi /qn /norestart' -Wait
        
    - name: Connect to Tailscale
      env:
        TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      run: |
        # Wait for the installer to finish extracting files in the background
        $exePath = "C:\Program Files\Tailscale\tailscale.exe"
        $timeout = 60
        while (!(Test-Path $exePath) -and $timeout -gt 0) {
            Start-Sleep -Seconds 2
            $timeout -= 2
        }
        
        if (!(Test-Path $exePath)) {
            Write-Error "Tailscale installation timed out or failed to extract."
            exit 1
        }
        
        # Start Tailscale
        & $exePath up --authkey=$env:TAILSCALE_AUTH_KEY --accept-routes
        
    - name: Enable Windows Remote Desktop (RDP)
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        
    - name: Set up RDP User Credentials
      run: |
        $Password = ConvertTo-SecureString "NewUser_2700" -AsPlainText -Force
        New-LocalUser "CloudUser" -Password $Password -Description "RDP User Account"
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "CloudUser"
        Add-LocalGroupMember -Group "Administrators" -Member "CloudUser"
        
    - name: Output Tailscale Connection Info
      run: |
        Write-Host "========================================="
        Write-Host "Tailscale Setup Complete!"
        Write-Host "Find the IP address of this machine in your Tailscale Admin Console."
        Write-Host "Username: CloudUser"
        Write-Host "Password: NewUser_2700"
        Write-Host "========================================="

    - name: Keep Runner Alive
      run: |
        while ($true) { Start-Sleep -Seconds 60 }
