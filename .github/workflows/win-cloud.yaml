name: Windows Cloud RDP over Pinggy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable Windows Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Set up RDP User Credentials
      run: |
        $Password = ConvertTo-SecureString "NewUser_2700" -AsPlainText -Force
        New-LocalUser "CloudUser" -Password $Password -Description "RDP User Account"
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "CloudUser"
        Add-LocalGroupMember -Group "Administrators" -Member "CloudUser"

    - name: Start Pinggy RDP Tunnel
      run: |
        # Launch SSH tunnel writing logs to a file
        Start-Process ssh -ArgumentList "-o StrictHostKeyChecking=no -o ServerAliveInterval=30 -p 443 -R 0:localhost:3389 a.pinggy.io" -RedirectStandardOutput "pinggy.log" -RedirectStandardError "pinggy_err.log"
        
        # Wait for tunnel establishment
        Start-Sleep -Seconds 8

        # Extract address from log file
        $logContent = Get-Content "pinggy.log" -Raw -ErrorAction SilentlyContinue
        Write-Host "--- PINGGY OUTPUT ---"
        Write-Host $logContent
        Write-Host "---------------------"

        Write-Host "========================================="
        Write-Host "Username: CloudUser"
        Write-Host "Password: NewUser_2700"
        Write-Host "========================================="

    - name: Keep Runner Alive
      run: |
        while ($true) { Start-Sleep -Seconds 60 }
