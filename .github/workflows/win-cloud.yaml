name: Ultra-Fast Windows Remote (RustDesk + Ngrok)

on:
  workflow_dispatch:
    inputs:
      NGROK_AUTH_TOKEN:
        description: 'Your free Ngrok Authtoken'
        required: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Set up RDP User Credentials
      run: |
        $Password = ConvertTo-SecureString "NewUser_2700" -AsPlainText -Force
        New-LocalUser "CloudUser" -Password $Password -Description "RDP User Account" -ErrorAction SilentlyContinue
        Add-LocalGroupMember -Group "Administrators" -Member "CloudUser" -ErrorAction SilentlyContinue

    - name: Install RustDesk & Ngrok
      run: |
        # Download RustDesk (Modern low-latency remote desktop)
        Invoke-WebRequest -Uri "https://github.com/rustdesk/rustdesk/releases/download/1.2.3-1/rustdesk-1.2.3-1-x86_64.exe" -OutFile "rustdesk.exe"
        
        # Download Ngrok
        Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyA1xQZYcd/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
        Expand-Archive -Path "ngrok.zip" -DestinationPath "." -Force

    - name: Start Services
      run: |
        # Configure Ngrok
        .\ngrok.exe config add-authtoken ${{ github.event.inputs.NGROK_AUTH_TOKEN }}
        
        # Launch RustDesk
        Start-Process .\rustdesk.exe
        
        # Start Ngrok Tunnel for TCP RDP (fallback) or direct connection
        Start-Job -ScriptBlock { .\ngrok.exe tcp 3389 }
        Start-Sleep -Seconds 5

        # Get public address
        $log = Invoke-RestMethod -Uri http://127.0.0.1:4040/api/tunnels
        Write-Host "======================================================="
        Write-Host "CONNECT VIA RDP TO: $($log.tunnels[0].public_url -replace 'tcp://', '')"
        Write-Host "Username: CloudUser"
        Write-Host "Password: NewUser_2700"
        Write-Host "======================================================="

    - name: Keep Alive
      run: |
        while ($true) { Start-Sleep -Seconds 60 }
