name: Windows Cloud RDP over Ngrok

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable Windows Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Optimize Visual Settings for Speed
      run: |
        Set-ItemProperty -Path 'HKLM:\Software\Policies\Microsoft\Windows\Control Panel\Desktop' -Name "UserPreferencesMask" -Value ([byte[]](0x90,0x12,0x03,0x80,0x10,0x00,0x00,0x00)) -ErrorAction SilentlyContinue
        Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "ColorDepth" -Value 2

    - name: Set up RDP User Credentials
      run: |
        $Password = ConvertTo-SecureString "NewUser_2700" -AsPlainText -Force
        New-LocalUser "CloudUser" -Password $Password -Description "RDP User Account"
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "CloudUser"
        Add-LocalGroupMember -Group "Administrators" -Member "CloudUser"

    - name: Install and Start Ngrok via Winget
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
      run: |
        # Install Ngrok using built-in winget package manager
        winget install --id Ngrok.Ngrok --accept-source-agreements --accept-package-agreements

        # Find ngrok executable location
        $ngrokPath = (Get-Command ngrok.exe -ErrorAction SilentlyContinue).Path
        if (-not $ngrokPath) {
            $ngrokPath = "$env:LocalAppData\Microsoft\WinGet\Packages\Ngrok.Ngrok_Microsoft.Winget.Source_8wekyb3d8bbwe\ngrok.exe"
        }

        # Configure token and start TCP tunnel on RDP port 3389
        & $ngrokPath config add-authtoken $env:NGROK_AUTH_TOKEN
        Start-Process -FilePath $ngrokPath -ArgumentList "tcp 3389"

        # Query local endpoint until live address is reported
        $publicUrl = ""
        for ($i = 0; $i -lt 15; $i++) {
            Start-Sleep -Seconds 2
            try {
                $response = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -ErrorAction Stop
                $publicUrl = $response.tunnels[0].public_url -replace "tcp://", ""
                if ($publicUrl) { break }
            } catch {
                Write-Host "Waiting for Ngrok tunnel..."
            }
        }

        if (-not $publicUrl) {
            Write-Error "Failed to retrieve Ngrok URL. Double check your NGROK_AUTH_TOKEN secret in Repository Settings."
            exit 1
        }

        Write-Host "========================================="
        Write-Host "RDP CONNECT ADDRESS: $publicUrl"
        Write-Host "Username: CloudUser"
        Write-Host "Password: NewUser_2700"
        Write-Host "========================================="

    - name: Keep Runner Alive
      run: |
        while ($true) { Start-Sleep -Seconds 60 }
