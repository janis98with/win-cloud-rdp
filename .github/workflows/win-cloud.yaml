name: Windows Cloud RDP over Bore (Ultra-Fast)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable Windows Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Optimize System & RDP Performance Settings
      run: |
        # Force 16-bit color depth (drastically reduces bandwidth/CPU usage)
        Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "ColorDepth" -Value 2
        
        # Enable RDP compression and prioritize speed
        Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name "DoNotAllowMinColorDepth" -Value 0
        
        # Disable Visual Effects (animations, smooth fonts, shadows)
        Set-ItemProperty -Path 'HKLM:\Software\Policies\Microsoft\Windows\Control Panel\Desktop' -Name "UserPreferencesMask" -Value ([byte[]](0x90,0x12,0x03,0x80,0x10,0x00,0x00,0x00)) -ErrorAction SilentlyContinue
        
        # Kill unnecessary heavy background services
        Stop-Service WSearch, SysMain, WindowsUpdate -ErrorAction SilentlyContinue
        Set-Service WSearch, SysMain, WindowsUpdate -StartupType Disabled -ErrorAction SilentlyContinue

    - name: Set up RDP User Credentials
      run: |
        $Password = ConvertTo-SecureString "NewUser_2700" -AsPlainText -Force
        New-LocalUser "CloudUser" -Password $Password -Description "RDP User Account"
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "CloudUser"
        Add-LocalGroupMember -Group "Administrators" -Member "CloudUser"

    - name: Install and Run Bore Tunnel
      run: |
        Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-pc-windows-msvc.zip" -OutFile "bore.zip"
        Expand-Archive -Path "bore.zip" -DestinationPath "." -Force

        $process = Start-Process powershell -ArgumentList "-Command .\bore.exe local 3389 --to bore.pub > bore.log 2>&1" -PassThru

        Start-Sleep -Seconds 8

        Write-Host "================= BORE CONNECTION INFO ================="
        Get-Content "bore.log"
        Write-Host "========================================================"
        Write-Host "Username: CloudUser"
        Write-Host "Password: NewUser_2700"

    - name: Keep Runner Alive
      run: |
        while ($true) { Start-Sleep -Seconds 60 }
