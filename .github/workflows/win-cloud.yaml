name: Windows Cloud RDP over Tailscale

on: 
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360 

    steps:
    - name: Download and Unzip Standalone Tailscale Package
      run: |
        # Download the official stable standalone zip archive for Windows x64
        Invoke-WebRequest -Uri "https://tailscale.com" -OutFile "tailscale.zip"
        
        # Unzip the files cleanly using native PowerShell utility
        Expand-Archive -Path "tailscale.zip" -DestinationPath "TailscaleFolder"
        
        # Locate the extracted subfolder dynamically and save the absolute path
        $subFolder = (Get-ChildItem -Path "TailscaleFolder" -Directory)[0].FullName
        echo "TAILSCALE_DIR=$subFolder" >> $env:GITHUB_ENV

    - name: Connect to Tailscale
      env:
        TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      run: |
        # Call the executable using the dynamically saved directory path
        & "${{ env.TAILSCALE_DIR }}\tailscale.exe" up --authkey=$env:TAILSCALE_AUTH_KEY --accept-routes
        
    - name: Enable Windows Remote Desktop (RDP)
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        
    - name: Set up RDP User Credentials
      run: |
        $Password = ConvertTo-SecureString "NewUser_2700" -AsPlainText -Force
        New-LocalUser "CloudUser" -Password $Password -Description "RDP User Account"
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "CloudUser"
        Add-LocalGroupMember -Group "Administrators" -Member "CloudUser"
        
    - name: Output Tailscale Connection Info
      run: |
        Write-Host "========================================="
        Write-Host "Tailscale Setup Complete!"
        Write-Host "Find the IP address of this machine in your Tailscale Admin Console."
        Write-Host "Username: CloudUser"
        Write-Host "Password: NewUser_2700"
        Write-Host "========================================="

    - name: Keep Runner Alive
      run: |
        while ($true) { Start-Sleep -Seconds 60 }
