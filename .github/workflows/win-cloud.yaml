name: Ultra-Fast Windows Remote (Ngrok RDP)

on:
  workflow_dispatch:
    inputs:
      NGROK_AUTH_TOKEN:
        description: 'Your free Ngrok Authtoken'
        required: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable Windows RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-NetFirewallRule -Name "RemoteDesktop-UserMode-In-TCP" -Enabled True -Profile Any
        Set-Service -Name "TermService" -StartupType Automatic
        Start-Service -Name "TermService" -ErrorAction SilentlyContinue

    - name: Optimize System Performance
      run: |
        $services = @("WSearch", "SysMain", "wuauserv")
        foreach ($service in $services) {
            Stop-Service -Name $service -ErrorAction SilentlyContinue
            Set-Service -Name $service -StartupType Disabled -ErrorAction SilentlyContinue
        }

    - name: Set up RDP User Credentials
      run: |
        $Password = ConvertTo-SecureString "NewUser_2700" -AsPlainText -Force
        New-LocalUser "CloudUser" -Password $Password -Description "RDP User Account" -ErrorAction SilentlyContinue
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "CloudUser" -ErrorAction SilentlyContinue
        Add-LocalGroupMember -Group "Administrators" -Member "CloudUser" -ErrorAction SilentlyContinue

    - name: Install and Launch Ngrok Tunnel
      run: |
        choco install ngrok -y
        
        # Refresh PATH environment variable after choco install
        $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

        # Authenticate Ngrok
        ngrok config add-authtoken ${{ github.event.inputs.NGROK_AUTH_TOKEN }}

        Write-Host "================= CONNECTION DETAILS ================="
        Write-Host "Username: CloudUser"
        Write-Host "Password: NewUser_2700"
        Write-Host "======================================================="

        # Launch ngrok directly in the foreground to keep runner alive and display host/port directly
        ngrok tcp 3389
