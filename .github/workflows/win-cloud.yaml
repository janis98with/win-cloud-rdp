name: Windows Cloud RDP over Pinggy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable Windows Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Set up RDP User Credentials
      run: |
        $Password = ConvertTo-SecureString "NewUser_2700" -AsPlainText -Force
        New-LocalUser "CloudUser" -Password $Password -Description "RDP User Account"
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "CloudUser"
        Add-LocalGroupMember -Group "Administrators" -Member "CloudUser"

    - name: Start Pinggy RDP Tunnel
      run: |
        # Start SSH and redirect stdout + stderr to pinggy.log
        $process = Start-Process powershell -ArgumentList "-Command ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -p 443 -R 0:localhost:3389 a.pinggy.io *>&1 > pinggy.log" -PassThru
        
        # Give SSH enough time to connect and print the banner
        Start-Sleep -Seconds 12

        # Dump log contents to step output
        if (Test-Path "pinggy.log") {
            Write-Host "================= PINGGY CONNECTION INFO ================="
            Get-Content "pinggy.log"
            Write-Host "=========================================================="
        } else {
            Write-Error "Log file not created."
        }

        Write-Host "Username: CloudUser"
        Write-Host "Password: NewUser_2700"

    - name: Keep Runner Alive
      run: |
        while ($true) { Start-Sleep -Seconds 60 }
