name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Optimize System Performance
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Control Manager\Memory Management' -Name "ClearPageFileAtShutdown" -Value 0

      - name: Set up RDP User Credentials
        run: |
          net user CloudUser NewUser_2700 /add
          net localgroup administrators CloudUser /add

      - name: Enable Windows RDP and Configure Firewall
        run: |
          # Disable NLA & Enable TS Connections
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          
          # Allow RDP & Ping in Firewall
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          New-NetFirewallRule -DisplayName "Allow RDP Port 3389" -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389 -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "Allow ICMP Ping" -Direction Inbound -Action Allow -Protocol ICMPv4 -ErrorAction SilentlyContinue
          
          # Start Remote Desktop Service
          Set-Service -Name "TermService" -StartupType Automatic
          Start-Service -Name "TermService" -ErrorAction SilentlyContinue

      - name: Connect to Tailscale Mesh
        shell: powershell
        run: |
          # Download and install Tailscale
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale-setup.exe"
          Start-Process -FilePath ".\tailscale-setup.exe" -ArgumentList "/quiet" -Wait
          
          # Start Tailscale service
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --accept-routes --unattended
          
          # Turn off Windows Firewall profiles so Tailscale traffic isn't blocked
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False

          Write-Host "================== CONNECTION DETAILS =================="
          Write-Host "Username: CloudUser"
          Write-Host "Password: NewUser_2700"
          Write-Host "========================================================"

      - name: Keep Runner Alive
        run: |
          while ($true) { Start-Sleep -Seconds 60 }
