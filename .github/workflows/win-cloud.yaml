name: Windows Cloud RDP over Serveo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable Windows Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Set up RDP User Credentials
      run: |
        $Password = ConvertTo-SecureString "NewUser_2700" -AsPlainText -Force
        New-LocalUser "CloudUser" -Password $Password -Description "RDP User Account"
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "CloudUser"
        Add-LocalGroupMember -Group "Administrators" -Member "CloudUser"

    - name: Start Serveo RDP Tunnel
      run: |
        # Launch Serveo SSH Tunnel and save log output
        $process = Start-Process powershell -ArgumentList "-Command ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R 0:localhost:3389 serveo.net > serveo.log 2>&1" -PassThru
        
        Start-Sleep -Seconds 10

        Write-Host "================= SERVEO CONNECTION INFO ================="
        Get-Content "serveo.log"
        Write-Host "=========================================================="
        Write-Host "Username: CloudUser"
        Write-Host "Password: NewUser_2700"

    - name: Keep Runner Alive
      run: |
        while ($true) { Start-Sleep -Seconds 60 }
